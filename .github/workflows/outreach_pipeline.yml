name: Autonomous Outreach Engine

on:
  schedule:
    # Jitter-Immune Heartbeat: Every 25 minutes across global business hours (02:00 - 18:59 UTC / 07:30 AM - 12:30 AM IST)
    # Flawlessly covers India (08:30-12:30 IST), Middle East (08:30-12:30 AST), Europe (08:00-12:30 BST), and US (08:30-12:30 PDT)
    - cron: '*/25 2-18 * * 1-5'
    # Nightly reply checks & state sync
    - cron: '0 21,0 * * 1-5'

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        default: 'send-batch'
        type: choice
        options:
          - tick
          - send-batch
          - research-and-draft
          - followups
          - check-replies
          - status
      region:
        description: 'Target region (US, India, ME, EU, All)'
        required: false
        default: 'All'
        type: choice
        options:
          - All
          - US
          - India
          - ME
          - EU
      auto_send:
        description: 'Directly send email instead of saving to Drafts'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Scheduled Action (Queue-Jitter Immune)
        id: schedule-decider
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ACTION=${{ github.event.inputs.action }}" >> $GITHUB_ENV
            echo "REGION=${{ github.event.inputs.region }}" >> $GITHUB_ENV
            echo "AUTO_SEND=${{ github.event.inputs.auto_send }}" >> $GITHUB_ENV
          else
            # Scheduled cron run: delegate to Python-native timezone controller
            echo "Scheduled cron triggered. Executing timezone-aware heartbeat tick."
            echo "ACTION=tick" >> $GITHUB_ENV
            echo "REGION=All" >> $GITHUB_ENV
            echo "AUTO_SEND=true" >> $GITHUB_ENV
          fi

      - name: Execute Autonomous Orchestrator
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'avnish-outreach-alert-797' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CONTEXT_DEV_API_KEY: ${{ secrets.CONTEXT_DEV_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
        run: |
          SEND_FLAG=""
          if [ "$AUTO_SEND" = "true" ]; then
            SEND_FLAG="--auto-send"
          fi
          
          echo "Executing: python3 cloud_orchestrator.py --action $ACTION --region $REGION $SEND_FLAG"
          python3 cloud_orchestrator.py --action "$ACTION" --region "$REGION" $SEND_FLAG
          
          # If action was not tick, run standalone reply check as fallback
          if [ "$ACTION" != "tick" ]; then
            python3 cloud_orchestrator.py --action check-replies
          fi

      - name: Persist Database Updates
        run: |
          git config --global user.name "Outreach Cloud Bot"
          git config --global user.email "bot@outreach.local"
          
          # Stash newly generated SQLite database and JSON
          cp outreach.db /tmp/outreach.db.runner 2>/dev/null || true
          cp curated_leads.json /tmp/curated_leads.json.runner 2>/dev/null || true
          
          # Fetch latest origin/main to prevent race-condition non-fast-forward rejections
          git fetch origin main
          git reset --hard origin/main
          
          # Restore updated files
          if [ -f /tmp/outreach.db.runner ]; then
            cp /tmp/outreach.db.runner outreach.db
          fi
          if [ -f /tmp/curated_leads.json.runner ]; then
            cp /tmp/curated_leads.json.runner curated_leads.json
          fi
          
          git add outreach.db curated_leads.json 2>/dev/null || true
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto-update outreach state & leads [skip ci]"
            for attempt in 1 2 3; do
              if git push origin main; then
                echo "Successfully persisted database state to origin/main."
                break
              fi
              echo "Push attempt $attempt failed, retrying in 2s..."
              sleep 2
              git fetch origin main
              git reset --soft origin/main
              git commit -m "Auto-update outreach state & leads [skip ci]" || true
            done
          else
            echo "No database changes to commit."
          fi
