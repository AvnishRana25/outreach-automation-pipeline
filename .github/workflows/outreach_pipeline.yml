name: Autonomous Outreach Engine

on:
  schedule:
    # 03:15 UTC = 08:45 AM IST (Daily Startup Research & Sourcing)
    - cron: '15 3 * * 1-5'
    # 03:55 & 04:15 UTC = 09:25 & 09:45 AM IST (India Morning Dispatch - Dual pulse)
    - cron: '55 3 * * 1-5'
    - cron: '15 4 * * 1-5'
    # 05:25 & 05:45 UTC = 10:55 & 11:15 AM IST (Middle East Morning Dispatch - Dual pulse)
    - cron: '25 5 * * 1-5'
    - cron: '45 5 * * 1-5'
    # 07:25 & 07:45 UTC = 12:55 & 01:15 PM IST (Europe & UK Morning Dispatch - Dual pulse)
    - cron: '25 7 * * 1-5'
    - cron: '45 7 * * 1-5'
    # 11:55 & 12:20 UTC = 05:25 & 05:50 PM IST (Mid-day Reply Checker & Follow-up Trigger)
    - cron: '55 11 * * 1-5'
    - cron: '20 12 * * 1-5'
    # 15:50 & 16:15 UTC = 09:20 & 09:45 PM IST (US West Coast Morning Dispatch - Dual pulse)
    - cron: '50 15 * * 1-5'
    - cron: '15 16 * * 1-5'
    # Periodic reply checks throughout the day
    - cron: '15 9,14,18 * * 1-5'

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to execute'
        required: true
        default: 'send-batch'
        type: choice
        options:
          - send-batch
          - research-and-draft
          - followups
          - check-replies
          - status
      region:
        description: 'Target region (US, India, ME, EU, All)'
        required: false
        default: 'All'
        type: choice
        options:
          - All
          - US
          - India
          - ME
          - EU
      auto_send:
        description: 'Directly send email instead of saving to Drafts'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Scheduled Action (Queue-Jitter Immune)
        id: schedule-decider
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ACTION=${{ github.event.inputs.action }}" >> $GITHUB_ENV
            echo "REGION=${{ github.event.inputs.region }}" >> $GITHUB_ENV
            echo "AUTO_SEND=${{ github.event.inputs.auto_send }}" >> $GITHUB_ENV
          else
            # Calculate minutes since midnight UTC (0-1439) for jitter-immune window matching
            H=$(date -u +%H)
            M=$(date -u +%M)
            # Remove leading zeros to avoid octal interpretation in bash
            H=$((10#$H))
            M=$((10#$M))
            TOTAL_MIN=$(( H * 60 + M ))
            echo "Current UTC Time: $H:$M (Minute $TOTAL_MIN of day)"

            # 02:00 - 03:45 UTC (120 - 225 min) -> Morning Research & Sourcing
            if [ $TOTAL_MIN -ge 120 ] && [ $TOTAL_MIN -le 225 ]; then
              echo "ACTION=research-and-draft" >> $GITHUB_ENV
              echo "REGION=All" >> $GITHUB_ENV
              echo "AUTO_SEND=false" >> $GITHUB_ENV

            # 03:46 - 05:15 UTC (226 - 315 min) -> India Send (09:15 - 10:45 AM IST)
            elif [ $TOTAL_MIN -ge 226 ] && [ $TOTAL_MIN -le 315 ]; then
              echo "ACTION=send-batch" >> $GITHUB_ENV
              echo "REGION=India" >> $GITHUB_ENV
              echo "AUTO_SEND=true" >> $GITHUB_ENV

            # 05:16 - 07:15 UTC (316 - 435 min) -> Middle East Send (09:15 - 11:15 AM Gulf)
            elif [ $TOTAL_MIN -ge 316 ] && [ $TOTAL_MIN -le 435 ]; then
              echo "ACTION=send-batch" >> $GITHUB_ENV
              echo "REGION=ME" >> $GITHUB_ENV
              echo "AUTO_SEND=true" >> $GITHUB_ENV

            # 07:16 - 11:30 UTC (436 - 690 min) -> Europe/UK Send (08:16 - 12:30 PM BST/CEST)
            elif [ $TOTAL_MIN -ge 436 ] && [ $TOTAL_MIN -le 690 ]; then
              echo "ACTION=send-batch" >> $GITHUB_ENV
              echo "REGION=EU" >> $GITHUB_ENV
              echo "AUTO_SEND=true" >> $GITHUB_ENV

            # 11:31 - 15:15 UTC (691 - 915 min) -> Mid-day Follow-ups
            elif [ $TOTAL_MIN -ge 691 ] && [ $TOTAL_MIN -le 915 ]; then
              echo "ACTION=followups" >> $GITHUB_ENV
              echo "REGION=All" >> $GITHUB_ENV
              echo "AUTO_SEND=true" >> $GITHUB_ENV

            # 15:16 - 19:30 UTC (916 - 1170 min) -> US West Coast Send (08:16 - 12:30 PM PDT)
            elif [ $TOTAL_MIN -ge 916 ] && [ $TOTAL_MIN -le 1170 ]; then
              echo "ACTION=send-batch" >> $GITHUB_ENV
              echo "REGION=US" >> $GITHUB_ENV
              echo "AUTO_SEND=true" >> $GITHUB_ENV

            # Night hours fallback (19:31 - 01:59 UTC) -> Reply checking only
            else
              echo "ACTION=check-replies" >> $GITHUB_ENV
              echo "REGION=All" >> $GITHUB_ENV
              echo "AUTO_SEND=false" >> $GITHUB_ENV
            fi
          fi

      - name: Execute Autonomous Orchestrator
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC || 'avnish-outreach-alert-797' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONTEXT_DEV_API_KEY: ${{ secrets.CONTEXT_DEV_API_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          PROSPEO_API_KEY: ${{ secrets.PROSPEO_API_KEY }}
        run: |
          SEND_FLAG=""
          if [ "$AUTO_SEND" = "true" ]; then
            SEND_FLAG="--auto-send"
          fi
          
          echo "Executing: python3 cloud_orchestrator.py --action $ACTION --region $REGION $SEND_FLAG"
          python3 cloud_orchestrator.py --action "$ACTION" --region "$REGION" $SEND_FLAG
          
          # Always run reply detection across all runs
          python3 cloud_orchestrator.py --action check-replies

      - name: Persist Database Updates
        run: |
          git config --global user.name "Outreach Cloud Bot"
          git config --global user.email "bot@outreach.local"
          git pull --rebase origin main 2>/dev/null || true
          git add outreach.db curated_leads.json 2>/dev/null || true
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto-update outreach state & leads [skip ci]"
            git push origin main
          else
            echo "No database changes to commit."
          fi
