name: Autonomous Outreach Engine
on:
  schedule:
    # Hourly reply reconciliation every day; dispatch only in recipient-local weekday mornings.
    - cron: '15 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Action to execute
        type: choice
        default: status
        options: [status, tick, research-and-draft, send-batch, followups, check-replies, reconcile, notify-test]
      region:
        description: Target region
        type: choice
        default: All
        options: [All, US, India, ME, EU]
      auto_send:
        description: Send instead of draft (tick always uses recipient-local morning windows)
        type: boolean
        default: false
      dry_run:
        description: Preview without database, Gmail or notification changes
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: outreach-authoritative-sender
  cancel-in-progress: false
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTREACH_CLOUD: '1'
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Refresh authoritative state inside serialized run
        run: |
          git pull --ff-only origin main
          git config user.name "Outreach Cloud Bot"
          git config user.email "bot@outreach.local"
      - name: Offline regression checks
        run: python3 -B -m unittest discover -v
      - name: Execute campaign action
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_REGION: ${{ inputs.region }}
          INPUT_SEND: ${{ inputs.auto_send }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python3 -B cloud_orchestrator.py --action tick
          else
            FLAGS=()
            if [ "$INPUT_SEND" = "true" ]; then FLAGS+=(--auto-send); fi
            if [ "$INPUT_DRY" = "true" ]; then FLAGS+=(--dry-run); fi
            python3 -B cloud_orchestrator.py --action "$INPUT_ACTION" --region "$INPUT_REGION" "${FLAGS[@]}"
          fi
      - name: Save state and refresh campaign snapshots even after failure
        if: ${{ always() && inputs.dry_run != true }}
        run: |
          python3 -B -c 'import db; db.checkpoint()'
          python3 -B generate_outreach.py sync
          python3 -B build_dashboard.py
          python3 -B build_full_campaign.py
          git add -- outreach.db curated_leads.json leads_tracker.csv index.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh outreach snapshots [skip ci]"
          fi
          git push origin HEAD:main
      - name: Preserve recovery evidence if state persistence fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: outreach-recovery-${{ github.run_id }}
          path: |
            outreach.db
            curated_leads.json
          retention-days: 7
